[package]
name = "telusur"
version = "0.1.0"
edition = "2024"
description = "Hybrid search engine in Rust: binary Matryoshka vectors with SIMD lookup tables + compressed BM25"
license = "MIT"
repository = "https://github.com/AustinPardosi/telusur"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
clap = { version = "4", features = ["derive"] }
fst = "0.4.7"
half = { version = "2.7.1", features = ["bytemuck"] }
memmap2 = "0.9.12"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "kernels"
harness = false
