name: CI

on: [push, pull_request]

# Override .cargo/config.toml's target-cpu=native: rust-cache restores artifacts built on one
# runner's CPU onto another, and native proc macros then crash rustc with SIGILL. Kernels pick
# their instruction set at runtime, so CI loses no coverage.
env:
  RUSTFLAGS: ""

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
